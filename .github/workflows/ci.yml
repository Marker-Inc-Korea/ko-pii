name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev + file + security)
        run: python -m pip install -e ".[dev,file,security]"

      - name: Run tests
        run: python -m pytest -q

  quality:
    name: Static checks and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install static analysis tools
        run: >-
          python -m pip install -e ".[dev,file,security]"
          "ruff==0.12.1" "mypy==1.17.1" "build==1.5.0"
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy
      - name: Build distributions
        run: python -m build --sdist --wheel
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/ko-pii-wheel
          /tmp/ko-pii-wheel/bin/python -m pip install dist/*.whl
          /tmp/ko-pii-wheel/bin/python -c "import importlib.metadata as m, ko_pii; assert m.version('ko-pii') == ko_pii.__version__"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ko-pii-distributions
          path: dist/*
          if-no-files-found: error

  regression:
    name: Synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Enforce measured synthetic floor
        run: |
          for seed in 0 1 2 3; do
            python -m ko_pii.eval.benchmark -n 60 --seed "$seed" \
              --min-micro-precision 0.68 \
              --min-micro-recall 0.95 \
              --min-micro-f1 0.80 \
              --min-macro-f1 0.60
          done
